name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen --no-editable
      - name: Lint
        run: uv run --frozen --no-editable ruff check src tests scripts
      - name: Check version consistency
        run: uv run --frozen --no-editable python scripts/check_version.py
      - name: Test
        run: uv run --frozen --no-editable pytest -q
