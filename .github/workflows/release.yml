name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen --no-editable
      - name: Lint
        run: uv run --frozen --no-editable ruff check src tests scripts
      - name: Check tag and version consistency
        run: uv run --frozen --no-editable python scripts/check_version.py --tag "${{ github.ref_name }}"
      - name: Test before packaging
        run: uv run --frozen --no-editable pytest -q
      - name: Build portable application
        run: uv run --frozen --no-editable pyinstaller --noconfirm anko-director.spec
      - name: Archive and checksum
        run: uv run --frozen --no-editable python scripts/package_release.py --platform ${{ matrix.platform }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: anko-director-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" \
            --title "Anko Director ${GITHUB_REF_NAME}"
